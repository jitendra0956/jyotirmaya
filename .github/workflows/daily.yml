name: jyotirmaya-daily

permissions:
  contents: write

on:
  schedule:
    # 5:30 AM IST (00:00 UTC) — generate + render + publish Part 1 directly
    - cron: "0 0 * * *"
    # 6:00 AM IST (00:30 UTC) — publish Part 2 only, 30 min later, separate
    # run — preserves the proven spacing that helps avoid Meta's
    # Development-Mode rate limiting, reuses content committed by the
    # 5:30 AM run rather than regenerating (would risk inconsistent
    # content between the two halves of the same day's post)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to use, YYYY-MM-DD (leave empty for today)"
        required: false
        default: ""
      part:
        description: "1, 2, or both — use 1/2 only to recover a partial publish failure without duplicating the other half"
        required: false
        default: "both"

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyswisseph pillow

      - name: Determine part and date
        id: vars
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PART="${{ github.event.inputs.part }}"
          elif [ "$SCHEDULE" = "0 0 * * *" ]; then
            PART="1"
          elif [ "$SCHEDULE" = "30 0 * * *" ]; then
            PART="2"
          else
            PART="both"
          fi
          echo "part=$PART" >> "$GITHUB_OUTPUT"

          MANUAL_DATE="${{ github.event.inputs.date }}"
          if [ -n "$MANUAL_DATE" ]; then
            echo "date=$MANUAL_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate content + render cards (Part 1 run only — Part 2 reuses this)
        if: steps.vars.outputs.part == '1' || steps.vars.outputs.part == 'both'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python engine/interpret.py ${{ steps.vars.outputs.date }}
          python render/cards.py ${{ steps.vars.outputs.date }}

      - name: Commit rendered cards (so the Part 2 run 30 min later can find them)
        if: steps.vars.outputs.part == '1' || steps.vars.outputs.part == 'both'
        run: |
          git config user.name "jyotirmaya-bot"
          git config user.email "bot@jyotirmaya"
          git add output/
          git commit -m "cards for ${{ steps.vars.outputs.date }}" || echo "nothing to commit"
          git push

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python publish/instagram.py ${{ steps.vars.outputs.date }} ${{ steps.vars.outputs.part }}

      - name: Notify on success
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -F chat_id=$TG_CHAT_ID \
            -F text="✅ Jyotirmaya published for ${{ steps.vars.outputs.date }} (part ${{ steps.vars.outputs.part }})" \
            https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage

      - name: Alert on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -F chat_id=$TG_CHAT_ID \
            -F text="⚠️ Jyotirmaya pipeline FAILED (part ${{ steps.vars.outputs.part }}). Post manually today!" \
            https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage

name: jyotirmaya-daily

permissions:
  contents: write

on:
  schedule:
    # 5:30 AM IST (00:00 UTC) — generate, render, and publish, all in one run.
    # No more Part 1/Part 2 split: the new Do/Dont grid design only needs
    # ~6 images total (cover + 2 Do's pages + 2 Dont's pages + optional
    # festival greeting), comfortably under Instagram's 10-item carousel
    # limit, so it's one single post now, not two.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to use, YYYY-MM-DD (leave empty for today)"
        required: false
        default: ""

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyswisseph pillow

      - name: Determine date
        id: vars
        run: |
          MANUAL_DATE="${{ github.event.inputs.date }}"
          if [ -n "$MANUAL_DATE" ]; then
            echo "date=$MANUAL_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate content + render cards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python engine/interpret.py ${{ steps.vars.outputs.date }}
          python render/cards.py ${{ steps.vars.outputs.date }}

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python publish/instagram.py ${{ steps.vars.outputs.date }}

      - name: Notify on success
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -F chat_id=$TG_CHAT_ID \
            -F text="✅ Jyotirmaya published for ${{ steps.vars.outputs.date }}" \
            https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage

      - name: Alert on failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -F chat_id=$TG_CHAT_ID \
            -F text="⚠️ Jyotirmaya pipeline FAILED. Post manually today!" \
            https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage
